<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; text-align: center; color: #fff;
         font-family: Georgia, serif;
         background: linear-gradient(135deg, #1d2671, #c33764); }
  h1 { font-size: 9rem; margin: 0; letter-spacing: .5rem; }
  p { font-size: 1.6rem; margin: .5rem 0; }
  em { opacity: .8; }
  a { display: inline-block; margin-top: 1.5rem; padding: .7rem 1.6rem;
      border: 2px solid #fff; border-radius: 2rem; color: #fff;
      text-decoration: none; }
  a:hover { background: #fff; color: #c33764; }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Ceci n'est pas une page.</p>
    <p><em>This is not a page. It never was.</em></p>
    <a href="/">Back to the real world</a>
  </div>
</body>
</html>
